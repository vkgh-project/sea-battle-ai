services:
  - type: web
    name: sea-battle-ai
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: APP_ORIGIN
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_AI_CONCURRENCY
        value: 1
